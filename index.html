<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>NEON VOLT — неоновый раннер</title>

<!-- [VK-FIX] Официальный VK Bridge -->
<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;height:100%;overflow:hidden;
  background:#05060f;color:#e8ecff;
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:none;overscroll-behavior:none;
}
#wrap{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background-color:#05060f;
  background-image:
    radial-gradient(ellipse 70% 90% at 15% 35%, rgba(77,226,197,0.14) 0%, transparent 55%),
    radial-gradient(ellipse 70% 90% at 85% 65%, rgba(180,99,255,0.14) 0%, transparent 55%),
    radial-gradient(ellipse at 50% 50%, #10173a 0%, #05060f 80%);
  overflow:hidden;
}
#wrap::before{
  content:'';position:absolute;inset:-15%;
  background:
    radial-gradient(circle at 30% 40%, rgba(77,226,197,0.12), transparent 45%),
    radial-gradient(circle at 70% 60%, rgba(180,99,255,0.12), transparent 45%);
  animation: bgPulse 14s ease-in-out infinite;
  pointer-events:none;z-index:0;
  will-change: transform, opacity;
}
@keyframes bgPulse{
  0%,100%{ transform: translate3d(0,0,0) scale(1);   opacity:.75; }
  50%    { transform: translate3d(2%,-2%,0) scale(1.06); opacity:1; }
}
#stage{
  position:relative;z-index:1;
  width:min(100vw, calc(100vh * 16 / 9));
  height:min(100vh, calc(100vw * 9 / 16));
  overflow:hidden;background:#06091a;
  border-radius:clamp(0px,1.4vmin,14px);
  box-shadow:
    0 0 100px rgba(77,226,197,.10),
    0 0 0 1px rgba(77,226,197,.12),
    0 0 120px rgba(180,99,255,.10),
    inset 0 0 120px rgba(0,0,0,.6);
}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
#ui{position:absolute;inset:0;pointer-events:none;font-size:1em;}

.hud{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s ease;}
.hud.visible{opacity:1;}
.hud-cell{position:absolute;top:1.2em;padding:0;}
.hud-cell.left{left:1.6em;text-align:left;}
.hud-cell.right{right:8.2em;text-align:right;}
.hud-label{font-size:.85em;letter-spacing:.18em;color:rgba(232,236,255,.42);font-weight:600;margin-bottom:.1em;}
.hud-value{font-size:2em;font-weight:900;color:#e8ecff;line-height:1;text-shadow:0 0 20px rgba(77,226,197,.35);}
.hud-value.gold{color:#ffd166;text-shadow:0 0 20px rgba(255,209,102,.4);}

.hud-bonus{
  position:absolute;top:6.5em;left:50%;transform:translateX(-50%);
  padding:.35em 1em;border-radius:999px;
  background:linear-gradient(180deg,#ffd166,#ff9a3d);
  color:#1a0d00;font-weight:900;font-size:1em;
  letter-spacing:.1em;pointer-events:none;
  box-shadow:0 0 30px rgba(255,196,90,.65), 0 0 60px rgba(255,196,90,.25);
  animation:bonusPulse .55s ease-in-out infinite alternate;z-index:5;
}
@keyframes bonusPulse{
  from{transform:translateX(-50%) scale(1);}
  to  {transform:translateX(-50%) scale(1.07);}
}

.icon-btn{
  position:absolute;top:1.2em;right:1.6em;
  width:2.4em;height:2.4em;border-radius:50%;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(20,26,55,.55);color:#e8ecff;
  font-size:1em;line-height:1;display:flex;align-items:center;justify-content:center;
  cursor:pointer;pointer-events:auto;transition:background .2s, transform .15s;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.icon-btn:hover{background:rgba(77,226,197,.18);transform:scale(1.06);}
.icon-btn:active{transform:scale(.94);}
#hudPause{right:4.9em;font-size:1.05em;font-weight:900;letter-spacing:-.05em;}

.touch-ui{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s ease;}
.touch-ui.visible{opacity:1;}
.touch-btn{
  position:absolute;bottom:1.4em;width:5.6em;height:5.6em;border-radius:50%;
  border:2px solid rgba(77,226,197,.45);
  background:radial-gradient(circle at 50% 40%, rgba(77,226,197,.22), rgba(77,226,197,.08));
  color:#4de2c5;display:flex;align-items:center;justify-content:center;
  cursor:pointer;pointer-events:auto;user-select:none;-webkit-user-select:none;
  transition:transform .12s, background .12s, border-color .12s;
  box-shadow:0 0 30px rgba(77,226,197,.25), inset 0 0 20px rgba(77,226,197,.12);
}
.touch-btn svg{width:52%;height:52%;filter:drop-shadow(0 0 6px rgba(77,226,197,.6));}
.touch-btn:active,.touch-btn.active{
  transform:scale(.92);
  background:radial-gradient(circle at 50% 40%, rgba(77,226,197,.45), rgba(77,226,197,.16));
  border-color:rgba(77,226,197,.9);
}
.touch-btn.duck{left:1.6em;}
.touch-btn.jump{right:1.6em;border-color:rgba(110,140,255,.5);color:#8ea6ff;background:radial-gradient(circle at 50% 40%, rgba(110,140,255,.22), rgba(110,140,255,.08));box-shadow:0 0 30px rgba(110,140,255,.25), inset 0 0 20px rgba(110,140,255,.12);}
.touch-btn.jump svg{filter:drop-shadow(0 0 6px rgba(110,140,255,.6));}

.screen{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:2em;opacity:0;pointer-events:none;transition:opacity .35s ease;
  background:radial-gradient(circle at 50% 40%, rgba(12,18,45,.72), rgba(3,5,14,.9));
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}
.screen.active{opacity:1;pointer-events:auto;}
.panel{
  width:min(30em, 100%);max-height:100%;overflow:auto;
  padding:2.4em 2.6em;border-radius:1.6em;
  background:linear-gradient(160deg, rgba(22,28,58,.92), rgba(9,13,32,.95));
  border:1px solid rgba(77,226,197,.22);
  box-shadow:0 24px 70px rgba(0,0,0,.65), 0 0 40px rgba(77,226,197,.10), inset 0 1px 0 rgba(255,255,255,.06);
  text-align:center;transform:translateY(14px) scale(.98);
  transition:transform .45s cubic-bezier(.2,.9,.3,1.25);font-size:1em;
}
.screen.active .panel{transform:translateY(0) scale(1);}
.title{font-size:3.4em;font-weight:900;letter-spacing:.04em;line-height:.98;margin-bottom:.15em;}
.title .t1{background:linear-gradient(180deg,#fff 0%,#b9d8ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 40px rgba(160,200,255,.4);}
.title .t2{background:linear-gradient(180deg,#7effe0 0%,#4de2c5 60%,#2aa88e 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 40px rgba(77,226,197,.55);}
.subtitle{font-size:1.02em;color:rgba(232,236,255,.62);margin-bottom:1.8em;letter-spacing:.02em;}
.best-row{display:flex;justify-content:center;align-items:baseline;gap:.7em;margin-bottom:1.8em;padding:.75em 1.1em;border-radius:.9em;background:rgba(77,226,197,.06);border:1px solid rgba(77,226,197,.15);}
.best-label{font-size:.82em;letter-spacing:.16em;color:rgba(232,236,255,.5);font-weight:600;}
.best-value{font-size:1.35em;font-weight:900;color:#ffd166;text-shadow:0 0 20px rgba(255,209,102,.5);}
.btn-col{display:flex;flex-direction:column;gap:.75em;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;padding:.85em 1.6em;border:none;border-radius:999px;font-family:inherit;font-size:1.02em;font-weight:800;letter-spacing:.02em;cursor:pointer;transition:transform .15s ease, box-shadow .25s ease, background .25s ease, color .2s;outline:none;-webkit-tap-highlight-color:transparent;}
.btn:active{transform:scale(.97);}
.btn-primary{background:linear-gradient(180deg,#85fbe0 0%,#4de2c5 55%,#2bb89b 100%);color:#031a14;box-shadow:0 10px 30px rgba(77,226,197,.42), inset 0 -3px 0 rgba(0,0,0,.16);}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 14px 40px rgba(77,226,197,.55), inset 0 -3px 0 rgba(0,0,0,.16);}
.btn-ghost{background:rgba(255,255,255,.055);color:#e8ecff;border:1px solid rgba(255,255,255,.14);}
.btn-ghost:hover{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.25);}
.btn-exit{background:rgba(255,77,109,.08);color:#ffb1c0;border:1px solid rgba(255,77,109,.28);}
.btn-exit:hover{background:rgba(255,77,109,.16);border-color:rgba(255,77,109,.5);color:#ffd6dd;}

/* [AD-FIX] Стили для кнопки Rewarded Video */
.btn-ad{background:linear-gradient(180deg,#ffd166 0%,#f0a020 100%);color:#1a0d00;box-shadow:0 10px 30px rgba(255,209,102,.35), inset 0 -3px 0 rgba(0,0,0,.16);position:relative;}
.btn-ad:hover{transform:translateY(-2px);box-shadow:0 14px 40px rgba(255,209,102,.5), inset 0 -3px 0 rgba(0,0,0,.16);}
.btn-ad:disabled{opacity:0.6;cursor:not-allowed;transform:none;box-shadow:none;}

.save-note{margin-top:1.1em;font-size:.8em;color:rgba(232,236,255,.42);letter-spacing:.02em;font-weight:500;line-height:1.4;}
.save-note .cloud{color:#4de2c5;margin-right:.35em;}

.title-sm{font-size:2em;font-weight:900;letter-spacing:.03em;margin-bottom:1.4em;color:#4de2c5;text-shadow:0 0 30px rgba(77,226,197,.45);}
.howto{display:flex;flex-direction:column;gap:1em;margin-bottom:1.6em;text-align:left;}
.howto-block{padding:.9em 1.1em;border-radius:.9em;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08);}
.howto-title{font-size:.8em;letter-spacing:.15em;font-weight:800;color:#4de2c5;margin-bottom:.55em;}
.howto-keys{font-size:.95em;color:rgba(232,236,255,.82);line-height:1.75;}
.key{display:inline-block;min-width:1.9em;padding:.1em .55em;margin:0 .12em;border-radius:.4em;background:rgba(110,140,255,.16);border:1px solid rgba(110,140,255,.35);color:#a9bcff;font-size:.85em;font-weight:700;text-align:center;}

.go-title{font-size:1.5em;font-weight:900;letter-spacing:.15em;color:#ff4d6d;text-shadow:0 0 30px rgba(255,77,109,.55);margin-bottom:1em;}
.go-record{font-size:1.02em;font-weight:800;color:#ffd166;text-shadow:0 0 24px rgba(255,209,102,.65);margin-bottom:.5em;animation:pulse 1.1s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:.7;}50%{opacity:1;}}
.go-score{font-size:3.6em;font-weight:900;line-height:1;color:#e8ecff;text-shadow:0 0 40px rgba(77,226,197,.45);margin:.1em 0;}
.go-label{font-size:.82em;letter-spacing:.2em;color:rgba(232,236,255,.42);font-weight:600;margin-bottom:1.1em;}
.go-best{font-size:1.02em;color:rgba(232,236,255,.72);margin-bottom:1.2em;}
.go-best span{color:#ffd166;font-weight:900;}

.pause-title{font-size:2.2em;font-weight:900;letter-spacing:.15em;color:#4de2c5;text-shadow:0 0 30px rgba(77,226,197,.45);margin-bottom:1.6em;}

.tut-hint{
  position:absolute;left:50%;bottom:8.5em;transform:translateX(-50%) translateY(14px);
  padding:.9em 1.5em;border-radius:1em;
  background:linear-gradient(180deg, rgba(20,28,58,.94), rgba(9,13,32,.94));
  border:1px solid rgba(77,226,197,.5);
  box-shadow:0 12px 40px rgba(0,0,0,.55), 0 0 30px rgba(77,226,197,.25);
  color:#e8ecff;font-weight:700;font-size:1.05em;letter-spacing:.02em;
  pointer-events:none;opacity:0;transition:opacity .35s ease, transform .35s ease;
  max-width:80%;text-align:center;white-space:nowrap;
}
.tut-hint.visible{opacity:1;transform:translateX(-50%) translateY(0);}
.tut-hint .ico{color:#4de2c5;margin-right:.4em;font-size:1.15em;}

.tut-done{
  position:absolute;left:50%;top:30%;transform:translate(-50%,-50%) scale(.9);
  padding:1em 2em;border-radius:1em;
  background:linear-gradient(180deg, rgba(77,226,197,.95), rgba(42,168,142,.95));
  color:#031a14;font-weight:900;font-size:1.6em;letter-spacing:.05em;
  box-shadow:0 12px 60px rgba(77,226,197,.5);
  pointer-events:none;opacity:0;transition:opacity .4s ease, transform .4s cubic-bezier(.2,.9,.3,1.3);
}
.tut-done.visible{opacity:1;transform:translate(-50%,-50%) scale(1);}

@media (max-width:520px){
  .panel{padding:1.8em 1.5em;}
  .title{font-size:2.6em;}
  .go-score{font-size:2.8em;}
  .touch-btn{width:4.6em;height:4.6em;bottom:1em;}
  .touch-btn.duck{left:1em;}
  .touch-btn.jump{right:1em;}
  .tut-hint{font-size:.9em;bottom:7.5em;padding:.75em 1.1em;white-space:normal;}
  .save-note{font-size:.75em;}
}
</style>
</head>

<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game"></canvas>

    <div id="ui">
      <div class="hud" id="hud">
        <div class="hud-cell left">
          <div class="hud-label" id="hudScoreLabel">ОЧКИ</div>
          <div class="hud-value" id="hudScore">0</div>
        </div>
        <div class="hud-cell right">
          <div class="hud-label" id="hudBestLabel">РЕКОРД</div>
          <div class="hud-value gold" id="hudBest">0</div>
        </div>
        <div class="hud-bonus" id="hudBonus" hidden>×2 БОНУС</div>
        <button class="icon-btn" id="hudPause" title="Pause" aria-label="Pause">⏸</button>
        <button class="icon-btn" id="hudSound" title="Звук" aria-label="Sound">🔊</button>
      </div>

      <div class="tut-hint" id="tutHint">
        <span class="ico">▸</span><span id="tutMsg">Нажми ПРОБЕЛ, чтобы прыгнуть</span>
      </div>
      <div class="tut-done" id="tutDone">ОТЛИЧНО! 🎉</div>

      <div class="touch-ui" id="touchUI">
        <button class="touch-btn duck" id="touchDuck" aria-label="Duck">
          <svg viewBox="0 0 40 40"><path d="M20 6 L34 24 L26 24 L26 34 L14 34 L14 24 L6 24 Z" fill="currentColor" transform="rotate(180 20 20)"/></svg>
        </button>
        <button class="touch-btn jump" id="touchJump" aria-label="Jump">
          <svg viewBox="0 0 40 40"><path d="M20 6 L34 24 L26 24 L26 34 L14 34 L14 24 L6 24 Z" fill="currentColor"/></svg>
        </button>
      </div>

      <div class="screen active" id="scrMenu">
        <div class="panel">
          <h1 class="title"><span class="t1">NEON</span><span class="t2" style="margin-left:0.15em;">VOLT</span></h1>
          <p class="subtitle" id="menuSubtitle">Бесконечный неоновый забег</p>
          <div class="best-row">
            <span class="best-label" id="menuBestLabel">ЛУЧШИЙ РЕЗУЛЬТАТ</span>
            <span class="best-value" id="menuBest">0</span>
          </div>
          <div class="btn-col">
            <button class="btn btn-primary" id="btnPlay">▶  Играть</button>
            <button class="btn btn-ghost" id="btnHowTo">Как играть</button>
            <button class="btn btn-ghost" id="btnSound">🔊  Звук: вкл</button>
            <button class="btn btn-exit" id="btnExit">⏻  Выйти из игры</button>
          </div>
          <p class="save-note" id="menuSaveNote"><span class="cloud">☁</span>Ваш рекорд сохраняется автоматически</p>
        </div>
      </div>

      <div class="screen" id="scrHowTo">
        <div class="panel">
          <div id="howtoContent"></div>
          <button class="btn btn-primary" id="btnHowToClose">Понятно</button>
        </div>
      </div>

      <div class="screen" id="scrGameOver">
        <div class="panel">
          <div class="go-title" id="goTitle">ИГРА ОКОНЧЕНА</div>
          <div class="go-record" id="goRecord" hidden></div>
          <div class="go-score" id="goScore">0</div>
          <div class="go-label" id="goLabel">ОЧКОВ НАБРАНО</div>
          <div class="go-best" id="goBestRow">Рекорд: <span id="goBest">0</span></div>
          <p class="save-note" id="goSaveNote"><span class="cloud">☁</span>Рекорд сохранён</p>
          <div class="btn-col">
            <!-- [AD-FIX] Кнопка Rewarded Video -->
            <button class="btn btn-ad" id="btnRewardedAd" style="display:none;">🎁 Смотреть рекламу и получить ×2</button>
            <button class="btn btn-primary" id="btnRestart">↻  Играть снова</button>
            <button class="btn btn-ghost" id="btnToMenu">В меню</button>
          </div>
        </div>
      </div>

      <div class="screen" id="scrPaused">
        <div class="panel">
          <div class="pause-title" id="pauseTitle">ПАУЗА</div>
          <div class="btn-col">
            <button class="btn btn-primary" id="btnResume">▶  Продолжить</button>
            <button class="btn btn-ghost" id="btnPauseMenu">В меню</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* ═════════════════════════════════════════════════════════════════════════
   NEON VOLT — VK Play Edition (с рекламной монетизацией)
   ═════════════════════════════════════════════════════════════════════════ */

/* ═════════════════════════════════════════════════════════════════════════
   [VK-FIX] VK BRIDGE
   ═════════════════════════════════════════════════════════════════════════ */

let vkBridgeReady = false;

function initVKBridge() {
  if (typeof vkBridge === 'undefined') {
    console.info('[VK] vkBridge not available — offline mode (localStorage fallback)');
    vkBridgeReady = false;
    return;
  }
  vkBridge.send('VKWebAppInit', {})
    .then(function () {
      vkBridgeReady = true;
      console.info('[VK] VKWebAppInit OK');
      return vkBridge.send('VKWebAppStorageGet', { keys: ['highscore'] });
    })
    .then(function (data) {
      if (!data || !data.keys || !Array.isArray(data.keys)) return;
      const item = data.keys.find(function (k) { return k.key === 'highscore'; });
      if (item && item.value) {
        const cloudScore = parseInt(item.value, 10) || 0;
        if (cloudScore > highscore) {
          highscore = cloudScore;
          saveHighscore();
          updateMenuBest();
        }
      }
    })
    .catch(function (err) {
      console.warn('[VK] init failed, using localStorage fallback:', err);
      vkBridgeReady = false;
    });
}

function saveToVKStorage() {
  if (!vkBridgeReady || typeof vkBridge === 'undefined') return;
  try {
    const p = vkBridge.send('VKWebAppStorageSet', {
      key: 'highscore',
      value: String(highscore)
    });
    if (p && p.catch) p.catch(function () { /* ignore */ });
  } catch (e) { /* ignore */ }
}

function exitToVK() {
  let bridgePromise = null;
  if (typeof vkBridge !== 'undefined') {
    try {
      bridgePromise = vkBridge.send('VKWebAppClose', { status: 'success' });
    } catch (e) {
      bridgePromise = null;
    }
  }
  if (bridgePromise && bridgePromise.catch) {
    bridgePromise.catch(function () { openVKPlayHome(); });
  } else {
    openVKPlayHome();
  }
}

function openVKPlayHome() {
  try {
    const w = window.open('https://vkplay.ru/', '_blank', 'noopener,noreferrer');
    if (!w) console.info('[VK] popup blocked — exit handled silently');
  } catch (e) { /* ignore */ }
}

/* ═════════════════════════════════════════════════════════════════════════
   [AD-FIX] РЕКЛАМНАЯ МОНЕТИЗАЦИЯ
   ═════════════════════════════════════════════════════════════════════════ */

// Interstitial: показываем раз в 3 игры
function showInterstitialAd() {
  if (!vkBridgeReady || typeof vkBridge === 'undefined') return;
  try {
    vkBridge.send('VKWebAppShowNativeAds', { ad_format: 'interstitial' })
      .then(function (data) {
        if (data && data.result) console.log('[VK Ads] Interstitial shown');
      })
      .catch(function (err) {
        console.warn('[VK Ads] Interstitial error:', err);
      });
  } catch (e) {
    console.warn('[VK Ads] Interstitial exception:', e);
  }
}

// Rewarded: показываем по клику игрока
let isRewardLoading = false;
function showRewardedAd(onSuccess) {
  if (isRewardLoading) return;
  if (!vkBridgeReady || typeof vkBridge === 'undefined') {
    console.info('[VK Ads] Bridge not ready, skipping ad');
    return;
  }

  isRewardLoading = true;
  const btn = dom.btnRewardedAd;
  const originalText = btn.textContent;
  
  btn.disabled = true;
  btn.textContent = '⏳ Загрузка...';

  // На время рекламы ставим звук на паузу
  Sound.stopAmbient();
  if (Sound.ctx && Sound.ctx.state === 'running') {
    try { Sound.ctx.suspend(); } catch (e) {}
  }

  vkBridge.send('VKWebAppShowNativeAds', { ad_format: 'reward' })
    .then(function (data) {
      // Проверяем, что реклама была показана и досмотрена
      if (data && data.result) {
        onSuccess();
      }
    })
    .catch(function (err) {
      console.warn('[VK Ads] Rewarded error:', err);
    })
    .finally(function () {
      isRewardLoading = false;
      btn.disabled = false;
      btn.textContent = originalText;
      
      // Возвращаем звук
      if (Sound.enabled) {
        Sound.init();
        Sound.resume();
        if (state === 'menu' || state === 'gameover') Sound.startAmbient();
      }
    });
}

const clamp  = (v, a, b) => v < a ? a : (v > b ? b : v);
const rnd    = (a, b) => a + Math.random() * (b - a);
const rndInt = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const aabb   = (ax, ay, aw, ah, bx, by, bw, bh) =>
  ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
function circleRect(cx, cy, cr, rx, ry, rw, rh) {
  const nx = clamp(cx, rx, rx + rw);
  const ny = clamp(cy, ry, ry + rh);
  const dx = cx - nx, dy = cy - ny;
  return dx * dx + dy * dy < cr * cr;
}

const Sound = {
  ctx: null, master: null, ambient: null, enabled: true,
  init() {
    if (this.ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try {
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.45;
      this.master.connect(this.ctx.destination);
      return true;
    } catch (e) { return false; }
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },

  playJump() {
    if (!this.enabled || !this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(220, t);
    o.frequency.exponentialRampToValueAtTime(760, t + 0.12);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.28, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + 0.18);
  },
  playDoubleJump() {
    if (!this.enabled || !this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(420, t);
    o.frequency.exponentialRampToValueAtTime(1100, t + 0.14);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.24, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + 0.2);
  },
  playCoin() {
    if (!this.enabled || !this.ctx) return;
    const t = this.ctx.currentTime;
    [988, 1319].forEach((freq, i) => {
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = 'sine'; o.frequency.value = freq;
      const s = t + i * 0.06;
      g.gain.setValueAtTime(0.0001, s);
      g.gain.exponentialRampToValueAtTime(0.22, s + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, s + 0.18);
      o.connect(g); g.connect(this.master);
      o.start(s); o.stop(s + 0.2);
    });
  },
  playHit() {
    if (!this.enabled || !this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(160, t);
    o.frequency.exponentialRampToValueAtTime(40, t + 0.35);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.35, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + 0.42);
    const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * 0.15, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++)
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 2);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 340;
    const ng = this.ctx.createGain(); ng.gain.value = 0.28;
    src.connect(bp); bp.connect(ng); ng.connect(this.master);
    src.start(t);
  },
  playBreak() {
    if (!this.enabled || !this.ctx) return;
    const t = this.ctx.currentTime;
    const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * 0.12, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++)
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 1.6);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass';
    bp.frequency.setValueAtTime(1200, t);
    bp.frequency.exponentialRampToValueAtTime(260, t + 0.11);
    const ng = this.ctx.createGain(); ng.gain.value = 0.32;
    src.connect(bp); bp.connect(ng); ng.connect(this.master);
    src.start(t);
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(660, t);
    o.frequency.exponentialRampToValueAtTime(990, t + 0.09);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.18, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + 0.16);
  },
  playBonus() {
    if (!this.enabled || !this.ctx) return;
    const t = this.ctx.currentTime;
    [660, 880, 1320, 1760].forEach((f, i) => {
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      const s = t + i * 0.055;
      g.gain.setValueAtTime(0.0001, s);
      g.gain.exponentialRampToValueAtTime(0.20, s + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, s + 0.16);
      o.connect(g); g.connect(this.master);
      o.start(s); o.stop(s + 0.18);
    });
  },
  playTutDone() {
    if (!this.enabled || !this.ctx) return;
    const t = this.ctx.currentTime;
    [523, 659, 784, 1047].forEach((f, i) => {
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      const s = t + i * 0.09;
      g.gain.setValueAtTime(0.0001, s);
      g.gain.exponentialRampToValueAtTime(0.22, s + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, s + 0.28);
      o.connect(g); g.connect(this.master);
      o.start(s); o.stop(s + 0.3);
    });
  },

  startAmbient() {
    if (!this.enabled || !this.ctx || this.ambient) return;
    const ctx = this.ctx;
    const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 55;
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 240; f.Q.value = 3;
    const vca = ctx.createGain(); vca.gain.value = 0.05;
    const lfo = ctx.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 0.55;
    const lg = ctx.createGain(); lg.gain.value = 0.02;
    lfo.connect(lg); lg.connect(vca.gain);
    const fade = ctx.createGain();
    fade.gain.setValueAtTime(0, ctx.currentTime);
    fade.gain.linearRampToValueAtTime(1, ctx.currentTime + 1.4);
    o.connect(f); f.connect(vca); vca.connect(fade); fade.connect(this.master);
    o.start(); lfo.start();
    this.ambient = { o, lfo, fade };
  },
  stopAmbient() {
    if (!this.ambient) return;
    const { o, lfo, fade } = this.ambient;
    const t = this.ctx.currentTime;
    fade.gain.cancelScheduledValues(t);
    fade.gain.setValueAtTime(fade.gain.value, t);
    fade.gain.linearRampToValueAtTime(0, t + 0.25);
    try { o.stop(t + 0.35); lfo.stop(t + 0.35); } catch (e) {}
    this.ambient = null;
  }
};

function makeCity(span, minH, maxH, minW, maxW) {
  const arr = []; let x = 0;
  while (x < span) {
    const w = rnd(minW, maxW), h = rnd(minH, maxH);
    arr.push({ x, w, h });
    x += w + rnd(6, 26);
  }
  const last = arr[arr.length - 1];
  return { arr, span: last.x + last.w + 60 };
}

function isTutorialDone() {
  try { return localStorage.getItem(LS_TUTORIAL) === '1'; } catch (e) { return false; }
}
function markTutorialDone() {
  try { localStorage.setItem(LS_TUTORIAL, '1'); } catch (e) {}
}

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  const sw = Math.min(w, (h * 16) / 9);
  const sh = Math.min(h, (w * 9) / 16);
  stage.style.width  = sw + 'px';
  stage.style.height = sh + 'px';
  stage.style.fontSize = Math.max(9, Math.min(20, sw / 55)) + 'px';
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width  = Math.round(GAME_W * dpr);
  canvas.height = Math.round(GAME_H * dpr);
}

function spawnParticle(x, y, vx, vy, life, size, color, gravity) {
  world.particles.push({
    x, y, vx, vy,
    life, maxLife: life, size, color,
    gravity: gravity === undefined ? 900 : gravity
  });
}
function dust(x, y, n) {
  for (let i = 0; i < n; i++) {
    spawnParticle(
      x + rnd(-16, 16), y + rnd(-4, 2),
      rnd(-140, -30), rnd(-150, -30),
      rnd(0.28, 0.55), rnd(1.6, 3.6),
      '#4de2c5', 720
    );
  }
}
function burst(x, y, n, color, speed) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU;
    const s = rnd(speed * 0.35, speed);
    spawnParticle(x, y, Math.cos(a) * s, Math.sin(a) * s,
      rnd(0.35, 0.9), rnd(1.8, 4.2), color, 480);
  }
}
function explode(x, y) {
  burst(x, y, 36, '#ff4d6d', 520);
  burst(x, y, 22, '#ffd166', 340);
  burst(x, y, 18, '#4de2c5', 260);
}
function spawnTrailParticle() {
  const cx = player.x + CFG.playerW / 2;
  const cy = player.feetY - player.h / 2;
  world.trail.push({
    x: cx + rnd(-3, 3), y: cy + rnd(-3, 3),
    life: 0.42, maxLife: 0.42,
    size: rnd(5, 9)
  });
  if (world.trail.length > 40) world.trail.shift();
}

function updateParticles(dt) {
  const scroll = world.scrollSpeed;
  for (let i = world.particles.length - 1; i >= 0; i--) {
    const p = world.particles[i];
    p.life -= dt;
    if (p.life <= 0) { world.particles.splice(i, 1); continue; }
    p.vy += p.gravity * dt;
    p.x += p.vx * dt - scroll * dt;
    p.y += p.vy * dt;
  }
  for (let i = world.trail.length - 1; i >= 0; i--) {
    const t = world.trail[i];
    t.life -= dt;
    t.x -= scroll * dt * 0.6;
    if (t.life <= 0) world.trail.splice(i, 1);
  }
  for (let i = world.popups.length - 1; i >= 0; i--) {
    const u = world.popups[i];
    u.life -= dt;
    if (u.life <= 0) { world.popups.splice(i, 1); continue; }
    u.y -= 42 * dt;
    u.x -= scroll * dt;
  }
}

const recentPatterns = [];
function rememberPattern(name) {
  recentPatterns.push(name);
  if (recentPatterns.length > 3) recentPatterns.shift();
}

function currentDifficulty() {
  const byTime  = world.time / 50;
  const byScore = score / 2200;
  return clamp(byTime * 0.55 + byScore * 0.45, 0, 1);
}

function pickPattern() {
  const diff = currentDifficulty();
  let pool = PATTERNS.filter(p => p.minDiff <= diff);
  if (pool.length === 0) pool = [PATTERNS[0]];

  let total = 0;
  const weights = pool.map(p => {
    let w = p.weight;
    if (recentPatterns.includes(p.name)) w *= 0.25;
    total += w;
    return w;
  });
  let r = Math.random() * total;
  for (let i = 0; i < pool.length; i++) {
    r -= weights[i];
    if (r <= 0) return pool[i];
  }
  return pool[pool.length - 1];
}

function spawnNextPattern() {
  const p = pickPattern();
  const result = p.build(GAME_W + 80);

  for (const e of result.ents) world.entities.push(e);
  rememberPattern(p.name);

  const baseSec = Math.max(CFG.safetyPause, rnd(CFG.baseGapMinSec, CFG.baseGapMaxSec));
  const basePx  = Math.max(CFG.minGapPx, baseSec * world.speed);
  world.spawnCooldownPx = basePx + result.width * 1.15 * p.cooldownMul;
}

   ТУТОРИАЛ
   ═════════════════════════════════════════════════════════════════════════ */
function startTutorial() {
  tutorial.active = true;
  tutorial.stage = TUT.JUMP;
  tutorial.spikeSpawned = false;
  tutorial.dodgePassed = false;
  tutorial.hintShown = false;
  showTutHint('tutJump');
}
function showTutHint(key) {
  const T = I18N[currentLang] || I18N.ru;
  dom.tutMsg.textContent = T[key] || key;
  dom.tutHint.classList.add('visible');
  tutorial.hintShown = true;
}
function hideTutHint() {
  dom.tutHint.classList.remove('visible');
  tutorial.hintShown = false;
}
function advanceTutorial(nextStage) {
  tutorial.stage = nextStage;
  if (nextStage === TUT.DODGE) {
    hideTutHint();
    setTimeout(() => {
      if (tutorial.active && tutorial.stage === TUT.DODGE)
        showTutHint('tutDodge');
    }, 350);
  } else if (nextStage === TUT.COIN) {
    hideTutHint();
    setTimeout(() => {
      if (tutorial.active && tutorial.stage === TUT.COIN)
        showTutHint('tutCoin');
    }, 350);
  }
}
function completeTutorial() {
  hideTutHint();
  tutorial.active = false;
  tutorial.stage = TUT.OFF;
  markTutorialDone();
  dom.tutDone.classList.add('visible');
  Sound.playTutDone();
  setTimeout(() => dom.tutDone.classList.remove('visible'), 1600);
}
function resetTutorialForRetry() {
  tutorial.active = true;
  tutorial.stage = TUT.JUMP;
  tutorial.spikeSpawned = false;
  tutorial.dodgePassed = false;
  tutorial.hintShown = false;
}

function computeSpeed() {
  if (tutorial.active) {
    if (tutorial.stage === TUT.DODGE) return CFG.tutorialSpeed1;
    if (tutorial.stage === TUT.COIN)  return CFG.tutorialSpeed2;
    return CFG.speedStart;
  }
  const byTime  = world.time * CFG.speedGrowthPerSec;
  const byScore = (score / CFG.pointsPerStep) * CFG.speedPerStep;
  return Math.min(CFG.speedMax, CFG.speedStart + byTime + byScore);
}

function spawnTutorialEntity() {
  if (tutorial.stage === TUT.DODGE && !tutorial.spikeSpawned) {
    world.entities.push({
      type:'spike', x: GAME_W + 80, y: GROUND_Y - 44, w: 32, h: 44, tut: true
    });
    tutorial.spikeSpawned = true;
  }
}

function handleTutorialProgress() {
  if (tutorial.stage === TUT.DODGE) {
    let still = false;
    for (const e of world.entities) {
      if (e.tut && e.x + e.w > player.x) { still = true; break; }
    }
    if (tutorial.spikeSpawned && !still) tutorial.dodgePassed = true;
    if (tutorial.dodgePassed) {
      advanceTutorial(TUT.COIN);
      world.spawnCooldownPx = 300;
    }
  } else if (tutorial.stage === TUT.COIN) {
    if (score >= CFG.tutorialTarget) {
      completeTutorial();
      world.spawnCooldownPx = 400;
    }
  }
}

/* ══════════════════════════ СТАРТ / СБРОС / КОНЕЦ ══════════════════════════ */
function resetGame() {
  world.time = 0;
  world.speed = CFG.speedStart;
  world.scrollSpeed = CFG.speedStart;
  world.spawnCooldownPx = 480;
  world.entities.length = 0;
  world.particles.length = 0;
  world.trail.length = 0;
  world.popups.length = 0;

  player.feetY = GROUND_Y;
  player.vy = 0;
  player.onGround = true;
  player.jumpsLeft = 1;
  player.coyote = 0;
  player.duckAmt = 0;
  player.sq = 1;
  player.footTimer = 0;
  player.runPhase = 0;
  player.trailTimer = 0;

  score = 0;
  shake = 0;
  isNewRecord = false;

  bonus.timeLeft = 0;
  bonus.active = false;
  dom.hudBonus.hidden = true;

  recentPatterns.length = 0;

  input.duck = false;
  duckSrc.key = false;
  duckSrc.touch = false;

  if (gameOverTimer) { clearTimeout(gameOverTimer); gameOverTimer = null; }
}

function startGame(opts) {
  opts = opts || {};
  resetGame();
  hideTutHint();
  dom.tutDone.classList.remove('visible');

  if (opts.tutorial) resetTutorialForRetry();
  else if (!isTutorialDone()) startTutorial();
  else { tutorial.active = false; tutorial.stage = TUT.OFF; }

  setState('play');
  updateHUDScore();
  if (Sound.enabled) { Sound.init(); Sound.resume(); Sound.startAmbient(); }
}

function pauseGame() {
  if (state !== 'play') return;
  setState('paused');
  Sound.stopAmbient();
  if (Sound.ctx && Sound.ctx.state === 'running') {
    try { Sound.ctx.suspend(); } catch (e) {}
  }
}
function resumeGame() {
  if (state !== 'paused') return;
  if (Sound.enabled) {
    Sound.init();
    Sound.resume();
    if (!Sound.ambient) Sound.startAmbient();
  }
  setState('play');
  lastT = 0;
}
function togglePause() {
  if (state === 'play') pauseGame();
  else if (state === 'paused') resumeGame();
}

function endGame() {
  if (state !== 'play') return;

  setState('gameover');
  shake = 24;
  hideTutHint();
  Sound.playHit();
  Sound.stopAmbient();
  explode(player.x + CFG.playerW / 2, player.feetY - 20);

  const finalScore = Math.floor(score);
  const wasTutorial = tutorial.active;

  if (!wasTutorial && finalScore > highscore) {
    highscore = finalScore;
    isNewRecord = true;
    saveHighscore();
    saveToVKStorage();
  }

  gamesPlayed++;

  if (gameOverTimer) clearTimeout(gameOverTimer);
  gameOverTimer = setTimeout(() => {
    if (state !== 'gameover') return;

    const T = I18N[currentLang] || I18N.ru;
    if (wasTutorial) {
      dom.goTitle.textContent = T.goTutoTitle;
      dom.goRecord.hidden = true;
      dom.goScore.textContent = String(finalScore);
      dom.goLabel.textContent = T.goLabel;
      dom.goBestRow.textContent = T.goTutoBest.replace('{n}', CFG.tutorialTarget);
      dom.btnRestart.textContent = T.btnRetryTuto;
      if (dom.goSaveNote) dom.goSaveNote.style.display = 'none';
      if (dom.btnRewardedAd) dom.btnRewardedAd.style.display = 'none'; // Скрываем рекламу в туториале
    } else {
      dom.goTitle.textContent = T.goTitle;
      dom.goRecord.hidden = !isNewRecord;
      dom.goRecord.textContent = T.goNewRecord;
      dom.goScore.textContent = String(finalScore);
      dom.goLabel.textContent = T.goLabel;
      dom.goBestRow.innerHTML = T.goBestPrefix + '<span>' + highscore + '</span>';
      dom.btnRestart.textContent = T.btnRestart;
      if (dom.goSaveNote) dom.goSaveNote.style.display = '';
      
      // [AD-FIX] Показываем кнопку рекламы только если есть VK Bridge
      if (dom.btnRewardedAd && vkBridgeReady) {
        dom.btnRewardedAd.style.display = 'flex';
      }
    }
    dom.btnToMenu.textContent = T.btnToMenu;

    dom.hud.classList.remove('visible');
    dom.touchUI.classList.remove('visible');
    dom.scrGameOver.classList.add('active');
    updateMenuBest();

    // [AD-FIX] Interstitial реклама раз в 3 игры (если не туториал)
    if (!wasTutorial && gamesPlayed % 3 === 0) {
      setTimeout(showInterstitialAd, 1500);
    }
  }, 750);
}

function setState(next) {
  state = next;

  dom.scrMenu.classList.toggle('active', next === 'menu');
  dom.scrHowTo.classList.toggle('active', next === 'howto');
  if (dom.scrPaused) dom.scrPaused.classList.toggle('active', next === 'paused');
  if (next !== 'gameover') dom.scrGameOver.classList.remove('active');

  const playing = next === 'play';
  dom.hud.classList.toggle('visible', playing);
  dom.touchUI.classList.toggle('visible', playing && isTouch);
  if (playing) updateHUDScore();
}

/* ══════════════════════════ ВВОД ══════════════════════════ */
function doJump() {
  if (state !== 'play') return;

  if (tutorial.active && tutorial.stage === TUT.JUMP) advanceTutorial(TUT.DODGE);

  if (input.duck) {
    duckSrc.key = false;
    duckSrc.touch = false;
    syncDuck();
  }

  if (player.onGround || player.coyote > 0) {
    player.vy = CFG.jumpVel;
    player.onGround = false;
    player.coyote = 0;
    player.jumpsLeft = 1;
    player.sq = 1.18;
    dust(player.x + CFG.playerW / 2, player.feetY, 7);
    Sound.playJump();
  } else if (player.jumpsLeft > 0) {
    player.vy = CFG.doubleJumpVel;
    player.jumpsLeft--;
    player.sq = 1.2;
    burst(player.x + CFG.playerW / 2, player.feetY - 8, 10, '#4de2c5', 200);
    Sound.playDoubleJump();
  }
}
function syncDuck() { input.duck = duckSrc.key || duckSrc.touch; }

window.addEventListener('keydown', e => {
  const c = e.code;
  if (c === 'Space' || c === 'ArrowUp' || c === 'KeyW') {
    e.preventDefault();
    if (e.repeat) return;
    if (state === 'play') doJump();
    else if (state === 'menu') startGame();
    else if (state === 'paused') resumeGame();
    else if (state === 'gameover' && dom.scrGameOver.classList.contains('active'))
      startGame({ tutorial: tutorial.active });
  } else if (c === 'ArrowDown' || c === 'KeyS') {
    e.preventDefault();
    duckSrc.key = true; syncDuck();
  } else if (c === 'Enter') {
    if (state === 'menu') startGame();
    else if (state === 'paused') resumeGame();
    else if (state === 'gameover' && dom.scrGameOver.classList.contains('active'))
      startGame({ tutorial: tutorial.active });
  } else if (c === 'Escape' || c === 'KeyP') {
    e.preventDefault();
    togglePause();
  }
}, { passive: false });

window.addEventListener('keyup', e => {
  if (e.code === 'ArrowDown' || e.code === 'KeyS') {
    duckSrc.key = false; syncDuck();
  }
});

let fsRequested = false;
function requestFullscreenOnce() {
  if (fsRequested) return;
  fsRequested = true;
  if (!isTouch) return;
  try {
    const el = document.documentElement;
    if (el.requestFullscreen) {
      const p = el.requestFullscreen();
      if (p && p.catch) p.catch(() => {});
    } else if (el.webkitRequestFullscreen) {
      el.webkitRequestFullscreen();
    }

/* ══════════════════════════ ФИЗИКА ИГРОКА ══════════════════════════ */
function getHitbox() {
  const h = CFG.standH - (CFG.standH - CFG.duckH) * player.duckAmt;
  return {
    x: player.x + 7,
    y: player.feetY - h + 5,
    w: CFG.playerW - 14,
    h: h - 8
  };
}

function updatePlayer(dt) {
  const canDuck = player.onGround;
  const wantDuck = input.duck && canDuck;
  const rate = wantDuck ? 22 : 14;
  player.duckAmt += ((wantDuck ? 1 : 0) - player.duckAmt) * Math.min(1, dt * rate);
  if (player.duckAmt < 0.001) player.duckAmt = 0;
  if (player.duckAmt > 0.999) player.duckAmt = 1;

  player.vy += CFG.gravity * dt;
  if (player.vy > CFG.maxFallSpeed) player.vy = CFG.maxFallSpeed;

  const prevFeet = player.feetY;
  player.feetY += player.vy * dt;

  const curH = CFG.standH - (CFG.standH - CFG.duckH) * player.duckAmt;
  const pL = player.x;
  const pR = player.x + CFG.playerW;
  let landed = false;

  if (player.vy >= 0) {
    for (let i = 0; i < world.entities.length; i++) {
      const e = world.entities[i];
      if (e.type !== 'platform' && e.type !== 'breakable') continue;
      if (e.broken) continue;

      if (prevFeet <= e.y + 1 && player.feetY >= e.y) {
        if (pR - 6 > e.x && pL + 6 < e.x + e.w) {
          if (e.type === 'breakable') {
            e.broken = true;
            player.feetY = e.y;
            player.vy = -620;
            player.jumpsLeft = 1;
            player.sq = 1.1;
            breakBlockEffect(e);
            landed = false;
          } else {
            player.feetY = e.y;
            player.vy = 0;
            landed = true;
          }
          break;
        }
      }
    }
  }

  if (player.feetY >= GROUND_Y) {
    if (!player.onGround && player.vy > 380) {
      dust(player.x + CFG.playerW / 2, GROUND_Y, 9);
      shake = Math.min(shake + 5, 8);
    }
    player.feetY = GROUND_Y;
    player.vy = 0;
    landed = true;
  }

  if (landed) {
    if (!player.onGround) player.sq = 0.72;
    player.onGround = true;
    player.jumpsLeft = 1;
    player.coyote = CFG.coyoteTime;
  } else {
    player.onGround = false;
    player.coyote = Math.max(0, player.coyote - dt);
  }

  player.sq += (1 - player.sq) * Math.min(1, dt * 14);

  if (player.onGround && state === 'play') {
    player.runPhase += dt * 13;
    player.footTimer -= dt;
    if (player.footTimer <= 0) {
      player.footTimer = 0.11;
      dust(player.x + CFG.playerW / 2 - 6, player.feetY, 2);
    }
  } else {
    player.runPhase += dt * 4;
  }

  if (!player.onGround && state === 'play') {
    player.trailTimer -= dt;
    if (player.trailTimer <= 0) {
      player.trailTimer = 0.028;
      spawnTrailParticle();
    }
  }

  player.h = curH;
  player.y = player.feetY - curH;
}

function breakBlockEffect(e) {
  const cx = e.x + e.w / 2;
  const cy = e.y + e.h / 2;
  burst(cx, cy, 22, '#c17b4a', 320);
  burst(cx, cy, 10, '#8b5a34', 220);
  burst(cx, cy, 6, '#4a2c14', 160);
  Sound.playBreak();
  world.popups.push({
    x: cx, y: cy - 10, text: 'SMASH!',
    life: 0.7, maxLife: 0.7
  });
}

/* ══════════════════════════ ОБНОВЛЕНИЕ СУЩНОСТЕЙ ══════════════════════════ */
function updateEntities(dt) {
  const hit = getHitbox();
  const ents = world.entities;
  const playerCX = player.x + CFG.playerW / 2;
  const playerCY = player.feetY - player.h / 2;

  for (let i = ents.length - 1; i >= 0; i--) {
    const e = ents[i];

    if (e.type === 'drone') {
      e.x -= (world.speed + Math.abs(e.vx)) * dt;
      e.t += dt * 11;
      e.y = e.baseY + Math.sin(e.t * 0.9) * 6;
    }
    else if (e.type === 'saw') {
      e.t += dt * e.freq * TAU;
      e.rot = (e.rot || 0) + dt * 14;
      if (e.motion === 'h') {
        e.baseX -= world.speed * dt;
        e.x = e.baseX + Math.sin(e.t) * e.amp;
      } else {
        e.x -= world.speed * dt;
        e.y = e.baseY + Math.sin(e.t) * e.amp;
      }
    }
    else if (e.type === 'breakable' && e.broken) {
      e.x -= world.speed * dt;
      if (e.x + e.w < -140) ents.splice(i, 1);
      continue;
    }
    else {
      e.x -= world.speed * dt;
    }

    if (e.x + e.w < -140) { ents.splice(i, 1); continue; }

    if (e.type === 'coin') {
      e.t += dt * 5.2;
      if (aabb(hit.x, hit.y, hit.w, hit.h, e.x + 5, e.y + 5, e.w - 10, e.h - 10)) {
        ents.splice(i, 1);
        collectCoin(e);
      }
    }
    else if (e.type === 'spike') {
      const cw = e.w * 0.55;
      const cx = e.x + (e.w - cw) / 2;
      const ch = e.h * 0.72;
      const cy = e.y + e.h - ch;
      if (aabb(hit.x, hit.y, hit.w, hit.h, cx, cy, cw, ch)) { endGame(); return; }
    }
    else if (e.type === 'barrier' || e.type === 'bar' || e.type === 'block') {
      if (aabb(hit.x, hit.y, hit.w, hit.h, e.x + 3, e.y + 3, e.w - 6, e.h - 6)) {
        endGame(); return;
      }
    }
    else if (e.type === 'breakable') {
      if (aabb(hit.x, hit.y, hit.w, hit.h, e.x + 3, e.y + 3, e.w - 6, e.h - 6)) {
        endGame(); return;
      }
    }
    else if (e.type === 'drone') {
      const cx = e.x + e.w / 2;
      const cy = e.y + e.h / 2;
      const cr = e.w * 0.42;
      if (circleRect(cx, cy, cr, hit.x, hit.y, hit.w, hit.h)) { endGame(); return; }
      if (!e.nearMissAwarded) {
        const dx = cx - playerCX;
        const dy = cy - playerCY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < CFG.bonusNearMiss && cx < playerCX + 40) {
          e.nearMissAwarded = true;
          activateBonus();
        }
      }
    }
    else if (e.type === 'saw') {
      const cx = e.x + e.w / 2;
      const cy = e.y + e.h / 2;
      const cr = e.w * 0.44;
      if (circleRect(cx, cy, cr, hit.x, hit.y, hit.w, hit.h)) { endGame(); return; }
      if (!e.nearMissAwarded) {
        const dx = cx - playerCX;
        const dy = cy - playerCY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < CFG.bonusNearMiss && cx < playerCX + 40) {
          e.nearMissAwarded = true;
          activateBonus();
        }
      }
    }
  }
}

function collectCoin(e) {
  const mult = bonus.active ? 2 : 1;
  const gained = CFG.coinScore * mult;
  score += gained;
  updateHUDScore();
  Sound.playCoin();
  burst(e.x + e.w / 2, e.y + e.h / 2, 12, '#ffd166', 230);
  burst(e.x + e.w / 2, e.y + e.h / 2, 6, '#fff0b8', 140);
  world.popups.push({
    x: e.x + e.w / 2, y: e.y,
    text: '+' + gained,
    life: 0.85, maxLife: 0.85
  });
}

function activateBonus() {
  const wasActive = bonus.active;
  bonus.active = true;
  bonus.timeLeft = CFG.bonusDuration;
  dom.hudBonus.hidden = false;
  if (!wasActive) Sound.playBonus();
  burst(player.x + CFG.playerW / 2, player.feetY - player.h / 2, 18, '#ffd166', 240);
}

/* ══════════════════════════ ГЛАВНЫЙ UPDATE ══════════════════════════ */
function updatePlay(dt) {
  world.time += dt;
  world.speed = computeSpeed();

  if (tutorial.active && tutorial.stage === TUT.JUMP) {
    updatePlayer(dt);
    return;
  }

  const mult = bonus.active ? 2 : 1;
  score += CFG.scorePerSec * dt * mult;
  updateHUDScore();

  if (bonus.active) {
    bonus.timeLeft -= dt;
    if (bonus.timeLeft <= 0) {
      bonus.timeLeft = 0;
      bonus.active = false;
      dom.hudBonus.hidden = true;
    }
  }

  if (tutorial.active) handleTutorialProgress();

  world.spawnCooldownPx -= world.speed * dt;
  if (world.spawnCooldownPx <= 0) {
    if (tutorial.active) {
      if (tutorial.stage === TUT.DODGE) spawnTutorialEntity();
      else if (tutorial.stage === TUT.COIN) {
        for (let i = 0; i < 4; i++) {
          world.entities.push({
            type:'coin', x: GAME_W + 80 + i * 50,
            y: GROUND_Y - 100, w: 26, h: 26, t: Math.random() * TAU
          });
        }
      }
      world.spawnCooldownPx = 350;
    } else {
      spawnNextPattern();
    }
  }

  updatePlayer(dt);
  updateEntities(dt);
}

function update(dt) {
  time += dt;

  let targetScroll = 60;
  if (state === 'play') targetScroll = world.speed;
  else if (state === 'gameover' || state === 'paused') targetScroll = 0;

  const k = (state === 'gameover' || state === 'paused') ? 9 : 6;
  world.scrollSpeed += (targetScroll - world.scrollSpeed) * Math.min(1, dt * k);
  world.scrollX += world.scrollSpeed * dt;

  for (let i = 0; i < stars.length; i++) {
    const s = stars[i];
    s.x -= world.scrollSpeed * s.p * dt;
    s.tw += dt * 2.5;
    if (s.x < -4) {
      s.x += GAME_W + 8;
      s.y = Math.random() * (GROUND_Y - 40);
    }
  }

  updateParticles(dt);
  if (shake > 0) shake = Math.max(0, shake - dt * 42);

  if (state === 'play') updatePlay(dt);
}

/* ═════════════════════════════════════════════════════════════════════════
   RENDER
   ═════════════════════════════════════════════════════════════════════════ */
let skyGrad = null, glowGrad = null;
let cityGradFar = null, cityGradNear = null;
let horizonFogGrad = null;

function roundRectPath(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}

function drawSky() {
  if (!skyGrad) {
    skyGrad = ctx.createLinearGradient(0, 0, 0, GAME_H);
    skyGrad.addColorStop(0,    '#0a0820');
    skyGrad.addColorStop(0.4,  '#151038');
    skyGrad.addColorStop(0.75, '#231a4a');
    skyGrad.addColorStop(1,    '#2a1a3e');
  }
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, GAME_W, GAME_H);

  if (!glowGrad) {
    glowGrad = ctx.createRadialGradient(720, 340, 0, 720, 340, 420);
    glowGrad.addColorStop(0,    'rgba(255,120,190,0.12)');
    glowGrad.addColorStop(0.35, 'rgba(140,90,220,0.08)');
    glowGrad.addColorStop(1,    'rgba(140,90,220,0)');
  }
  ctx.fillStyle = glowGrad;
  ctx.fillRect(0, 0, GAME_W, GAME_H);
}

function drawStars() {
  for (let i = 0; i < stars.length; i++) {
    const s = stars[i];
    const tw = 0.7 + 0.3 * Math.sin(s.tw);
    ctx.globalAlpha = s.a * tw;
    ctx.fillStyle = '#e4ecff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawMountains() {
  const off = world.scrollX * 0.07;
  ctx.fillStyle = '#1a1240';
  ctx.beginPath();
  ctx.moveTo(-40, GROUND_Y + 6);
  for (let x = -40; x <= GAME_W + 40; x += 8) {
    const wx = (x + off) * 0.0085;
    const y = GROUND_Y - 90
            - Math.sin(wx) * 46
            - Math.sin(wx * 2.31 + 1.2) * 22
            - Math.sin(wx * 0.7 + 0.4) * 30;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(GAME_W + 40, GROUND_Y + 6);
  ctx.closePath();
  ctx.fill();
}

function drawSilhouette(bx, w, h) {
  const topY = GROUND_Y - h;
  const r = Math.min(8, w * 0.30, h * 0.30);

  ctx.beginPath();
  ctx.moveTo(bx, GROUND_Y + 6);
  ctx.lineTo(bx, topY + r);
  ctx.quadraticCurveTo(bx, topY, bx + r, topY);
  ctx.lineTo(bx + w - r, topY);
  ctx.quadraticCurveTo(bx + w, topY, bx + w, topY + r);
  ctx.lineTo(bx + w, GROUND_Y + 6);
  ctx.closePath();
  ctx.fill();
}

function drawCity(city, parallax, which, seedShift) {
  let grad;
  if (which === 'far') {
    if (!cityGradFar) {
      cityGradFar = ctx.createLinearGradient(0, GROUND_Y - 240, 0, GROUND_Y + 6);
      cityGradFar.addColorStop(0, '#221848');
      cityGradFar.addColorStop(1, '#0f0a28');
    }
    grad = cityGradFar;
  } else {
    if (!cityGradNear) {
      cityGradNear = ctx.createLinearGradient(0, GROUND_Y - 240, 0, GROUND_Y + 6);
      cityGradNear.addColorStop(0, '#191236');
      cityGradNear.addColorStop(1, '#0a0620');
    }
    grad = cityGradNear;
  }
  ctx.fillStyle = grad;

  const off = (world.scrollX * parallax + seedShift) % city.span;
  for (let pass = 0; pass < 2; pass++) {
    const shift = -off + pass * city.span;
    for (let i = 0; i < city.arr.length; i++) {
      const b = city.arr[i];
      const bx = b.x + shift;
      if (bx > GAME_W + 60 || bx + b.w < -60) continue;
      drawSilhouette(bx, b.w, b.h);
    }
  }
}

function drawHorizonFog() {
  if (!horizonFogGrad) {
    horizonFogGrad = ctx.createLinearGradient(0, GROUND_Y - 140, 0, GROUND_Y + 20);
    horizonFogGrad.addColorStop(0,    'rgba(90, 60, 160, 0)');
    horizonFogGrad.addColorStop(0.65, 'rgba(90, 60, 160, 0.10)');
    horizonFogGrad.addColorStop(1,    'rgba(90, 60, 160, 0.03)');
  }
  ctx.fillStyle = horizonFogGrad;
  ctx.fillRect(0, GROUND_Y - 140, GAME_W, 160);
}

function drawGround() {
  const grad = ctx.createLinearGradient(0, GROUND_Y, 0, GROUND_Y + 96);
  grad.addColorStop(0, '#1c2148');
  grad.addColorStop(1, '#080c1f');
  ctx.fillStyle = grad;
  ctx.fillRect(-40, GROUND_Y, GAME_W + 80, GAME_H - GROUND_Y + 80);

  ctx.save();
  ctx.strokeStyle = 'rgba(77,226,197,0.10)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  const off = world.scrollX % 64;
  for (let x = -off - 64; x < GAME_W + 64; x += 64) {
    ctx.moveTo(x, GROUND_Y);
    ctx.lineTo(x - 60, GAME_H + 30);
  }
  for (let i = 1; i <= 3; i++) {
    const y = GROUND_Y + i * 26;
    ctx.moveTo(-40, y);
    ctx.lineTo(GAME_W + 40, y);
  }
  ctx.stroke();
  ctx.restore();

  ctx.save();
  ctx.shadowColor = '#4de2c5';
  ctx.shadowBlur = 18;
  ctx.fillStyle = '#4de2c5';
  ctx.fillRect(-40, GROUND_Y - 3, GAME_W + 80, 3);
  ctx.restore();

  ctx.fillStyle = 'rgba(77,226,197,0.30)';
  ctx.fillRect(-40, GROUND_Y + 7, GAME_W + 80, 1);
}

function drawSpike(e) {
  const grad = ctx.createLinearGradient(e.x, e.y, e.x, e.y + e.h);
  grad.addColorStop(0,   '#ff9ab0');
  grad.addColorStop(0.4, '#ff4d6d');
  grad.addColorStop(0.75,'#c32649');
  grad.addColorStop(1,   '#5c0f22');

  ctx.save();
  ctx.shadowColor = '#ff4d6d';
  ctx.shadowBlur = 14;
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(e.x, e.y + e.h);
  ctx.lineTo(e.x + e.w / 2, e.y);
  ctx.lineTo(e.x + e.w, e.y + e.h);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  ctx.fillStyle = 'rgba(255,255,255,0.32)';
  ctx.beginPath();
  ctx.moveTo(e.x + e.w / 2, e.y + 5);
  ctx.lineTo(e.x + e.w * 0.7, e.y + e.h - 3);
  ctx.lineTo(e.x + e.w / 2 + 2, e.y + e.h - 3);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = 'rgba(0,0,0,0.25)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(e.x + e.w / 2, e.y + e.h - 4);
  ctx.lineTo(e.x + e.w / 2, e.y + 10);
  ctx.stroke();
}

function drawBlock(e) {
  const grad = ctx.createLinearGradient(e.x, e.y, e.x + e.w, e.y + e.h);
  grad.addColorStop(0,   '#e06478');
  grad.addColorStop(0.5, '#a02a45');
  grad.addColorStop(1,   '#4a0c1e');

  ctx.save();
  ctx.shadowColor = 'rgba(255,77,109,0.65)';
  ctx.shadowBlur = 14;
  ctx.fillStyle = grad;
  roundRectPath(e.x, e.y, e.w, e.h, 6);
  ctx.fill();
  ctx.restore();

  ctx.fillStyle = '#ff7d96';
  roundRectPath(e.x + 3, e.y + 3, e.w - 6, 3, 1.5);
  ctx.fill();

  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  const seed = Math.floor(e.x / 7) + 13;
  for (let j = 0; j < 6; j++) {
    const rx = e.x + 6 + ((seed * (j + 1) * 17) % (e.w - 12));
    const ry = e.y + 8 + ((seed * (j + 3) * 11) % (e.h - 16));
    ctx.fillRect(rx, ry, 3, 3);
  }
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  roundRectPath(e.x + 4, e.y + e.h - 5, e.w - 8, 3, 1.5);
  ctx.fill();
}

function drawBarrier(e) {
  const grad = ctx.createLinearGradient(e.x, e.y, e.x, e.y + e.h);
  grad.addColorStop(0,   '#ffd166');
  grad.addColorStop(0.5, '#f0a020');
  grad.addColorStop(1,   '#a05a08');

  ctx.save();
  ctx.shadowColor = '#ffaa33';
  ctx.shadowBlur = 14;
  ctx.fillStyle = grad;
  roundRectPath(e.x, e.y, e.w, e.h, 4);
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.beginPath();
  roundRectPath(e.x, e.y, e.w, e.h, 4);
  ctx.clip();
  ctx.strokeStyle = 'rgba(30,15,0,0.65)';
  ctx.lineWidth = 7;
  ctx.beginPath();
  for (let xx = -e.h; xx < e.w + e.h; xx += 18) {
    ctx.moveTo(e.x + xx, e.y + e.h);
    ctx.lineTo(e.x + xx + e.h, e.y);
  }
  ctx.stroke();
  ctx.restore();

  ctx.fillStyle = '#fff3b0';
  roundRectPath(e.x + 2, e.y + 1, e.w - 4, 3, 1.5);
  ctx.fill();

  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  roundRectPath(e.x + 3, e.y + e.h - 3, e.w - 6, 2, 1);
  ctx.fill();
}

function drawBar(e) {
  const grad = ctx.createLinearGradient(e.x, e.y, e.x, e.y + e.h);
  grad.addColorStop(0, '#4a1830');
  grad.addColorStop(0.5, '#2c0d20');
  grad.addColorStop(1, '#12040f');

  ctx.save();
  ctx.shadowColor = 'rgba(255,77,109,0.55)';
  ctx.shadowBlur = 14;
  ctx.fillStyle = grad;
  roundRectPath(e.x, e.y, e.w, e.h, 8);
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.beginPath();
  roundRectPath(e.x + 5, e.y + 8, e.w - 10, e.h - 20, 4);
  ctx.clip();
  ctx.strokeStyle = 'rgba(255,77,109,0.35)';
  ctx.lineWidth = 7;
  ctx.beginPath();
  for (let xx = -e.h; xx < e.w + e.h; xx += 20) {
    ctx.moveTo(e.x + xx, e.y + e.h);
    ctx.lineTo(e.x + xx + e.h, e.y);
  }
  ctx.stroke();
  ctx.restore();

  ctx.fillStyle = '#ff4d6d';
  roundRectPath(e.x + 2, e.y + e.h - 6, e.w - 4, 4, 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,77,109,0.4)';
  roundRectPath(e.x + 3, e.y + 2, e.w - 6, 2, 1);
  ctx.fill();
}

function drawPlatform(e) {
  const grad = ctx.createLinearGradient(e.x, e.y, e.x, e.y + e.h);
  grad.addColorStop(0,   '#8ba0ff');
  grad.addColorStop(0.5, '#4b5fb8');
  grad.addColorStop(1,   '#141c48');

  ctx.save();
  ctx.shadowColor = 'rgba(110,140,255,0.65)';
  ctx.shadowBlur = 16;
  ctx.fillStyle = grad;
  roundRectPath(e.x, e.y, e.w, e.h, 8);
  ctx.fill();
  ctx.restore();

  ctx.fillStyle = '#a9bcff';
  roundRectPath(e.x + 2, e.y + 1, e.w - 4, 3, 1.5);
  ctx.fill();

  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  roundRectPath(e.x + 4, e.y + e.h - 3, e.w - 8, 2, 1);
  ctx.fill();
}

function drawCoin(e) {
  const cx = e.x + e.w / 2;
  const cy = e.y + e.h / 2;
  const spin = Math.max(0.16, Math.abs(Math.cos(e.t)));
  const r = e.w / 2;

  ctx.save();
  ctx.globalAlpha = 0.5;
  ctx.shadowColor = '#ffd166';
  ctx.shadowBlur = 22;
  ctx.fillStyle = '#ffd166';
  ctx.beginPath();
  ctx.arc(cx, cy, r * 0.7, 0, TAU);
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(spin, 1);

  const grad = ctx.createRadialGradient(-r * 0.3, -r * 0.3, 0, 0, 0, r * 1.15);
  grad.addColorStop(0,    '#fff6cf');
  grad.addColorStop(0.35, '#ffd166');
  grad.addColorStop(0.75, '#e0a53a');
  grad.addColorStop(1,    '#7c4d0e');

  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, TAU);
  ctx.fill();

  ctx.strokeStyle = 'rgba(255,255,255,0.6)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.72, 0, TAU);
  ctx.stroke();

  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath();
  ctx.ellipse(-r * 0.28, -r * 0.32, r * 0.20, r * 0.32, -0.5, 0, TAU);
  ctx.fill();

  ctx.restore();
}

function drawDrone(e) {
  const cx = e.x + e.w / 2;
  const cy = e.y + e.h / 2;
  const w = e.w, h = e.h;

  ctx.save();
  ctx.globalAlpha = 0.35;
  ctx.shadowColor = '#b463ff';
  ctx.shadowBlur = 30;
  ctx.fillStyle = '#b463ff';
  ctx.beginPath();
  ctx.arc(cx, cy, w * 0.5, 0, TAU);
  ctx.fill();
  ctx.restore();

  const spinPhase = e.t;
  const propY1 = cy - h * 0.55;
  const propY2 = cy + h * 0.55;
  ctx.save();
  ctx.strokeStyle = 'rgba(200,150,255,0.7)';
  ctx.lineWidth = 2;
  for (let k = 0; k < 3; k++) {
    const a = spinPhase + k * (Math.PI * 2 / 3);
    const ex = Math.cos(a) * w * 0.45;
    const ey = Math.sin(a) * 2.5;
    ctx.beginPath();
    ctx.moveTo(cx - ex, propY1 - ey);
    ctx.lineTo(cx + ex, propY1 + ey);
    ctx.stroke();
  }
  for (let k = 0; k < 3; k++) {
    const a = -spinPhase * 1.2 + k * (Math.PI * 2 / 3);
    const ex = Math.cos(a) * w * 0.45;
    const ey = Math.sin(a) * 2.5;
    ctx.beginPath();
    ctx.moveTo(cx - ex, propY2 - ey);
    ctx.lineTo(cx + ex, propY2 + ey);
    ctx.stroke();
  }
  ctx.restore();

  ctx.strokeStyle = 'rgba(140,90,210,0.9)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(cx - w * 0.42, propY1);
  ctx.lineTo(cx + w * 0.42, propY1);
  ctx.moveTo(cx - w * 0.42, propY2);
  ctx.lineTo(cx + w * 0.42, propY2);
  ctx.stroke();

  const bodyGrad = ctx.createRadialGradient(cx - 4, cy - 4, 2, cx, cy, w * 0.55);
  bodyGrad.addColorStop(0,   '#e8d4ff');
  bodyGrad.addColorStop(0.35,'#b463ff');
  bodyGrad.addColorStop(0.75,'#5c1a9e');
  bodyGrad.addColorStop(1,   '#26064a');

  ctx.save();
  ctx.shadowColor = '#b463ff';
  ctx.shadowBlur = 18;
  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.ellipse(cx, cy, w * 0.42, h * 0.5, 0, 0, TAU);
  ctx.fill();
  ctx.restore();

  const eyeGrad = ctx.createRadialGradient(cx - 1, cy - 1, 0.5, cx, cy, 5);
  eyeGrad.addColorStop(0, '#ffe0e6');
  eyeGrad.addColorStop(0.4, '#ff4d6d');
  eyeGrad.addColorStop(1, '#7a0522');

  ctx.save();
  ctx.shadowColor = '#ff4d6d';
  ctx.shadowBlur = 12 + Math.sin(e.t * 3) * 4;
  ctx.fillStyle = eyeGrad;
  ctx.beginPath();
  ctx.arc(cx, cy, 5, 0, TAU);
  ctx.fill();
  ctx.restore();

  ctx.fillStyle = 'rgba(255,220,255,0.35)';
  ctx.beginPath();
  ctx.arc(cx - w * 0.36, cy, 2, 0, TAU);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx + w * 0.36, cy, 2, 0, TAU);
  ctx.fill();
}

function drawSaw(e) {
  const cx = e.x + e.w / 2;
  const cy = e.y + e.h / 2;
  const R = e.w / 2;
  const teeth = 14;
  const rot = e.rot || 0;

  ctx.save();
  ctx.globalAlpha = 0.32;
  ctx.shadowColor = '#ff6b3d';
  ctx.shadowBlur = 30;
  ctx.fillStyle = '#ff6b3d';
  ctx.beginPath();
  ctx.arc(cx, cy, R * 0.85, 0, TAU);
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.shadowColor = '#ff6b3d';
  ctx.shadowBlur = 12;

  const grad = ctx.createRadialGradient(cx - R * 0.25, cy - R * 0.25, 2, cx, cy, R * 1.05);
  grad.addColorStop(0,    '#ffffff');
  grad.addColorStop(0.25, '#ffd0a8');
  grad.addColorStop(0.55, '#ff6b3d');
  grad.addColorStop(0.85, '#8a1a05');
  grad.addColorStop(1,    '#2a0602');

  ctx.fillStyle = grad;
  ctx.beginPath();
  for (let i = 0; i < teeth * 2; i++) {
    const angle = (i / (teeth * 2)) * TAU + rot;
    const r = (i % 2 === 0) ? R : R * 0.72;
    const px = cx + Math.cos(angle) * r;
    const py = cy + Math.sin(angle) * r;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  ctx.fillStyle = 'rgba(30,10,5,0.7)';
  ctx.beginPath();
  ctx.arc(cx, cy, R * 0.45, 0, TAU);
  ctx.fill();

  ctx.strokeStyle = 'rgba(255,190,120,0.5)';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  for (let i = 0; i < 40; i++) {
    const t = i / 40;
    const angle = t * Math.PI * 4 + rot;
    const r = t * R * 0.42;
    const px = cx + Math.cos(angle) * r;
    const py = cy + Math.sin(angle) * r;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.stroke();

  ctx.fillStyle = '#2a0a05';
  ctx.beginPath();
  ctx.arc(cx, cy, 3, 0, TAU);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,220,180,0.90)';
  ctx.beginPath();
  ctx.arc(cx - 0.8, cy - 0.8, 1.2, 0, TAU);
  ctx.fill();
}

function drawBreakable(e) {
  if (e.broken) return;

  const grad = ctx.createLinearGradient(e.x, e.y, e.x + e.w, e.y + e.h);
  grad.addColorStop(0,   '#d9a06e');
  grad.addColorStop(0.5, '#a66a3a');
  grad.addColorStop(1,   '#4a2c14');

  ctx.save();
  ctx.shadowColor = 'rgba(193,123,74,0.7)';
  ctx.shadowBlur = 14;
  ctx.fillStyle = grad;
  roundRectPath(e.x, e.y, e.w, e.h, 5);
  ctx.fill();
  ctx.restore();

  ctx.fillStyle = 'rgba(255,220,180,0.35)';
  roundRectPath(e.x + 3, e.y + 2, e.w - 6, 3, 1.5);
  ctx.fill();

  ctx.strokeStyle = 'rgba(40,15,5,0.75)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  const seed = Math.floor(e.x / 5) | 0;
  for (let i = 0; i < 4; i++) {
    const sx = e.x + 6 + ((seed * (i + 1) * 23) % (e.w - 12));
    const sy = e.y + 6 + ((seed * (i + 2) * 19) % (e.h - 12));
    const dx = ((seed * (i + 3) * 7) % 20) - 10;
    const dy = ((seed * (i + 4) * 11) % 20) - 10;
    ctx.moveTo(sx, sy);
    ctx.lineTo(sx + dx * 0.4, sy + dy * 0.4);
    ctx.lineTo(sx + dx, sy + dy);
  }
  ctx.stroke();

  ctx.strokeStyle = 'rgba(255,220,180,0.55)';
  ctx.lineWidth = 2;
  const cxx = e.x + e.w / 2;
  const cyy = e.y + e.h / 2;
  ctx.beginPath();
  ctx.moveTo(cxx - 6, cyy - 6); ctx.lineTo(cxx + 6, cyy + 6);
  ctx.moveTo(cxx + 6, cyy - 6); ctx.lineTo(cxx - 6, cyy + 6);
  ctx.stroke();

  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  roundRectPath(e.x + 4, e.y + e.h - 4, e.w - 8, 3, 1.5);
  ctx.fill();
}

function drawEntities() {
  const ents = world.entities;
  for (let i = 0; i < ents.length; i++) {
    const e = ents[i];
    switch (e.type) {
      case 'spike':     drawSpike(e);     break;
      case 'block':     drawBlock(e);     break;
      case 'barrier':   drawBarrier(e);   break;
      case 'bar':       drawBar(e);       break;
      case 'platform':  drawPlatform(e);  break;
      case 'coin':      drawCoin(e);      break;
      case 'drone':     drawDrone(e);     break;
      case 'saw':       drawSaw(e);       break;
      case 'breakable': drawBreakable(e); break;
    }
  }
}

function drawPlayer() {
  const isAir = !player.onGround && state === 'play';
  const dk = player.duckAmt;
  const stretchBase = clamp(1 - player.vy / 5400, 0.85, 1.17);
  const stretch = stretchBase * player.sq;
  const cx = player.x + CFG.playerW / 2;
  const feetY = player.feetY;
  const curH = CFG.standH - (CFG.standH - CFG.duckH) * dk;

  const C = {
    dark:   '#1a5e52',
    mid:    '#2aa88e',
    accent: '#4de2c5',
    light:  '#8bfbe4',
    visor:  '#091825',
    glow:   '#ffd166'
  };

  ctx.save();
  ctx.translate(cx, feetY);
  ctx.scale(1 / stretch, stretch);
  ctx.scale(1, curH / CFG.standH);

  const phase = player.runPhase;
  const swing    = isAir ? 0 : Math.sin(phase) * 2.6;
  const swingOpp = -swing;
  const bob      = isAir ? 0 : Math.sin(phase * 2) * 0.9;

  ctx.fillStyle = C.dark;
  roundRectPath(-9 + swing, -15, 8, isAir ? 10 : 15, 3); ctx.fill();
  ctx.fillStyle = C.mid;
  roundRectPath(1 + swingOpp, -15, 8, isAir ? 10 : 15, 3); ctx.fill();
  ctx.fillStyle = C.accent;
  roundRectPath(-10 + swing, isAir ? -6 : -3, 10, 3, 1.5); ctx.fill();
  roundRectPath(0 + swingOpp, isAir ? -6 : -3, 10, 3, 1.5); ctx.fill();

  const armY = -30 + Math.round(dk * 8) + bob;
  const armSwingL = isAir ? -6 : swingOpp * 1.3;
  const armSwingR = isAir ? -6 : swing * 1.3;
  ctx.fillStyle = C.dark;
  roundRectPath(-15, armY + armSwingL * 0.3, 6, isAir ? 10 : 13, 3); ctx.fill();
  ctx.fillStyle = C.mid;
  roundRectPath(9, armY + armSwingR * 0.3, 6, isAir ? 10 : 13, 3); ctx.fill();

  const bodyTopY = -32 + Math.round(dk * 14);
  const bodyBotY = -12;
  const bodyH = bodyBotY - bodyTopY;
  const bodyW = 24;

  const bodyGrad = ctx.createLinearGradient(0, bodyTopY, 0, bodyBotY);
  bodyGrad.addColorStop(0, C.light);
  bodyGrad.addColorStop(0.45, C.accent);
  bodyGrad.addColorStop(1, C.mid);

  ctx.save();
  ctx.shadowColor = C.accent;
  ctx.shadowBlur = 20;
  ctx.fillStyle = bodyGrad;
  roundRectPath(-bodyW / 2, bodyTopY, bodyW, bodyH, 6);
  ctx.fill();
  ctx.restore();

  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  roundRectPath(-bodyW / 2 + 3, bodyTopY + 2, bodyW - 6, 2.5, 1.2);
  ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.20)';
  roundRectPath(-bodyW / 2 + 3, bodyBotY - 3, bodyW - 6, 2, 1);
  ctx.fill();

  const pulse = 0.6 + 0.4 * Math.sin(time * 6);
  ctx.fillStyle = C.glow;
  ctx.shadowColor = C.glow;
  ctx.shadowBlur = 10 * pulse;
  ctx.beginPath();
  ctx.arc(0, bodyTopY + bodyH * 0.55, 2.6, 0, TAU);
  ctx.fill();
  ctx.shadowBlur = 0;

  const headR = 9;
  const headCY = bodyTopY - headR + 1;

  ctx.fillStyle = C.dark;
  ctx.fillRect(-3, headCY + headR - 2, 6, 3);

  const headGrad = ctx.createRadialGradient(-3, headCY - 3, 0.5, 0, headCY, headR * 1.55);
  headGrad.addColorStop(0,   '#e6fffa');
  headGrad.addColorStop(0.4, C.accent);
  headGrad.addColorStop(1,   C.dark);

  ctx.save();
  ctx.shadowColor = C.accent;
  ctx.shadowBlur = 18;
  ctx.fillStyle = headGrad;
  ctx.beginPath();
  ctx.arc(0, headCY, headR, 0, TAU);
  ctx.fill();
  ctx.restore();

  ctx.fillStyle = C.visor;
  roundRectPath(-7, headCY - 5/2 + 0.5, 14, 5, 2.5);
  ctx.fill();

  const eyeAlpha = isAir ? 0.9 : 0.7 + 0.3 * Math.sin(time * 5);
  ctx.fillStyle = C.glow;
  ctx.shadowColor = C.glow;
  ctx.shadowBlur = 7 * eyeAlpha;
  ctx.beginPath(); ctx.arc(-3, headCY + 0.5, 1.4, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc( 3, headCY + 0.5, 1.4, 0, TAU); ctx.fill();
  ctx.shadowBlur = 0;

  const antTipY = headCY - headR - 6;
  ctx.strokeStyle = C.accent;
  ctx.lineWidth = 1.3;
  ctx.beginPath();
  ctx.moveTo(0, headCY - headR + 0.5);
  ctx.lineTo(0, antTipY);
  ctx.stroke();
  const antPulse = 0.5 + 0.5 * Math.sin(time * 8);
  ctx.fillStyle = C.glow;
  ctx.shadowColor = C.glow;
  ctx.shadowBlur = 10 * antPulse;
  ctx.beginPath(); ctx.arc(0, antTipY, 2, 0, TAU); ctx.fill();
  ctx.shadowBlur = 0;

  ctx.restore();

  if (state === 'play' && !player.onGround && player.jumpsLeft > 0) {
    ctx.save();
    ctx.globalAlpha = 0.55 + 0.35 * Math.sin(time * 10);
    ctx.fillStyle = '#8ea6ff';
    ctx.shadowColor = '#8ea6ff';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(cx, feetY + 14, 3, 0, TAU);
    ctx.fill();
    ctx.restore();
  }
}

function drawTrail() {
  const arr = world.trail;
  for (let i = 0; i < arr.length; i++) {
    const t = arr[i];
    const a = clamp(t.life / t.maxLife, 0, 1);
    ctx.globalAlpha = a * 0.55;
    ctx.fillStyle = '#4de2c5';
    ctx.shadowColor = '#4de2c5';
    ctx.shadowBlur = 14 * a;
    ctx.beginPath();
    ctx.arc(t.x, t.y, t.size * (0.4 + a * 0.6), 0, TAU);
    ctx.fill();
  }
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
}

function drawParticles() {
  const ps = world.particles;
  for (let i = 0; i < ps.length; i++) {
    const p = ps[i];
    const a = clamp(p.life / p.maxLife, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    const r = p.size * (0.35 + a * 0.65);
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawPopups() {
  const ups = world.popups;
  ctx.textAlign = 'center';
  ctx.font = '800 22px "Segoe UI", system-ui, sans-serif';
  for (let i = 0; i < ups.length; i++) {
    const u = ups[i];
    const a = clamp(u.life / u.maxLife, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = u.text === 'SMASH!' ? '#ffb066' : '#ffd166';
    ctx.shadowColor = ctx.fillStyle;
    ctx.shadowBlur = 12;
    ctx.fillText(u.text, u.x, u.y);
  }
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
}

function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  drawSky();
  drawStars();

  ctx.save();
  if (shake > 0.4) {
    ctx.translate(rnd(-shake, shake) * 0.5, rnd(-shake, shake) * 0.5);
  }

  drawMountains();
  drawCity(cityFar,  0.20, 'far',  240);
  drawCity(cityNear, 0.42, 'near',   0);
  drawHorizonFog();

  drawGround();
  drawEntities();

  if (state === 'play' || state === 'menu' || state === 'howto' || state === 'paused') {
    drawTrail();
    drawPlayer();
  }

  drawParticles();
  drawPopups();

  ctx.restore();
}

/* ══════════════════════════ UI-ХЕЛПЕРЫ ══════════════════════════ */
let lastHudScore = -1;
function updateHUDScore() {
  const s = Math.floor(score);
  if (s !== lastHudScore) {
    lastHudScore = s;
    dom.hudScore.textContent = String(s);
  }
}
function updateMenuBest() {
  dom.menuBest.textContent = String(highscore);
  dom.hudBest.textContent  = String(highscore);
}
function updateSoundButtons() {
  const T = I18N[currentLang] || I18N.ru;
  const on = Sound.enabled;
  dom.btnSound.textContent = on ? T.btnSoundOn : T.btnSoundOff;
  dom.hudSound.textContent = on ? '🔊' : '🔇';
  dom.hudSound.title = on ? T.soundOnTitle : T.soundOffTitle;
}

/* ══════════════════════════ MAIN LOOP ══════════════════════════ */
let lastT = 0;
function loop(now) {
  if (!lastT) lastT = now;
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 1 / 30) dt = 1 / 30;
  if (dt < 0) dt = 0;

  update(dt);
  render();
  requestAnimationFrame(loop);
}

document.addEventListener('visibilitychange', function () {
  if (document.hidden) {
    Sound.stopAmbient();
    if (Sound.ctx && Sound.ctx.state === 'running') {
      try { Sound.ctx.suspend(); } catch (e) {}
    }
    if (state === 'play') pauseGame();
  } else {
    lastT = 0;
    if (state === 'play' && Sound.enabled && Sound.ctx) {
      try { Sound.ctx.resume(); } catch (e) {}
      if (!Sound.ambient) Sound.startAmbient();
    }
  }
});

window.addEventListener('blur', function () {
  Sound.stopAmbient();
  if (Sound.ctx && Sound.ctx.state === 'running') {
    try { Sound.ctx.suspend(); } catch (e) {}
  }
  if (state === 'play') pauseGame();
});

window.addEventListener('focus', function () {
  lastT = 0;
  if (state === 'play' && Sound.enabled && Sound.ctx) {
    try { Sound.ctx.resume(); } catch (e) {}
    if (!Sound.ambient) Sound.startAmbient();
  }
});

/* ══════════════════════════ INIT ══════════════════════════ */
function init() {
  resize();
  loadHighscore();
  loadSoundPref();

  const navLang = ((navigator.language || 'ru') + '').toLowerCase().startsWith('ru') ? 'ru' : 'en';
  applyLang(navLang);

  updateMenuBest();
  updateSoundButtons();

  initVKBridge();

  resetGame();
  setState('menu');
  requestAnimationFrame(loop);
}
init();
</script>
